services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gymtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: gymtrack
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test.sql:/docker-entrypoint-initdb.d/001-init-test.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d gymtrack
          && psql -U "$${POSTGRES_USER}" -d gymtrack_test -tAc 'SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_UI_TLS_CERT: /tls/localhost.pem
      MP_UI_TLS_KEY: /tls/localhost-key.pem
      MP_DISABLE_VERSION_CHECK: 'true'
      TZ: UTC
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - type: bind
        source: ${TLS_CERT_PATH:-${GYMTRACK_TLS_DIR:-${HOME}/.local/share/gymtrack/tls}/localhost.pem}
        target: /tls/localhost.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:-${GYMTRACK_TLS_DIR:-${HOME}/.local/share/gymtrack/tls}/localhost-key.pem}
        target: /tls/localhost-key.pem
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
